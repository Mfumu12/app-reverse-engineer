[project]
name = "app-reverse-engineer"
version = "0.1.0"
description = "Local offline-first toolkit for AI agents to reverse engineer apps and native binaries, explain features in plain English, and show evidence."
requires-python = ">=3.9"
authors = [{ name = "you" }]
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
    "typer>=0.9",
    "requests>=2.28",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
ollama = ["ollama>=0.1"]

[project.scripts]
are = "are.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["are*"]

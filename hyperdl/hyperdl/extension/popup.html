<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, -apple-system, sans-serif; width: 270px; margin: 0; padding: 14px; background: #11141b; color: #e4e4e7; }
  h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #f4f4f5; }
  label { display: block; font-size: 11px; color: #a1a1aa; margin-top: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; border-radius: 5px; border: 1px solid #27272a; background: #0b0d11; color: #f4f4f5; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #d4d4d8; }
  button { margin-top: 12px; width: 100%; padding: 7px; border: 0; border-radius: 5px; background: #2563eb; color: #fff; font-weight: 500; font-size: 12px; cursor: pointer; }
  button:hover { background: #3b82f6; }
  #status { margin-top: 8px; font-size: 11px; color: #34d399; }
</style>
</head>
<body>
  <h3>Gennius DM Integrator</h3>
  <label>Servidor local
    <input id="serverUrl" type="text" value="http://127.0.0.1:8787" />
  </label>
  <label>API Key (opcional)
    <input id="apiKey" type="text" placeholder="Opcional" />
  </label>
  <div class="row">
    <input id="autoCapture" type="checkbox" />
    <span>Intercetar downloads do navegador</span>
  </div>
  <button id="save">Guardar e Testar</button>
  <div id="status"></div>
  <script>
    const serverInput = document.getElementById("serverUrl");
    const keyInput = document.getElementById("apiKey");
    const capInput = document.getElementById("autoCapture");
    const statusEl = document.getElementById("status");
    chrome.storage.local.get({ serverUrl: "http://127.0.0.1:8787", apiKey: "", autoCapture: false }, (res) => {
      serverInput.value = res.serverUrl;
      keyInput.value = res.apiKey;
      capInput.checked = res.autoCapture;
    });
    document.getElementById("save").onclick = async () => {
      const serverUrl = serverInput.value.trim();
      const apiKey = keyInput.value.trim();
      const autoCapture = capInput.checked;
      await chrome.storage.local.set({ serverUrl, apiKey, autoCapture });
      try {
        const r = await fetch(`${serverUrl.replace(/\/$/, "")}/api/ping`);
        const j = await r.json();
        statusEl.style.color = "#34d399";
        statusEl.textContent = `Ligado: ${j.name || j.app} v${j.version}`;
      } catch (e) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Servidor Gennius DM indisponível";
      }
    };
  </script>
</body>
</html>

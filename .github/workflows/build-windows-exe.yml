name: Build Windows EXE (Gennius DM)

on:
  push:
    paths:
      - "hyperdl/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run tests
        working-directory: hyperdl
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
          pytest -v tests

      - name: Build GenniusDM.exe with PyInstaller
        working-directory: hyperdl
        run: |
          pyinstaller --clean --noconfirm hyperdl.spec

      - name: Smoke test GenniusDM.exe --version
        working-directory: hyperdl
        run: |
          .\dist\GenniusDM.exe --version

      - name: Upload GenniusDM.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenniusDM-Windows-x64
          path: hyperdl/dist/GenniusDM.exe
          if-no-files-found: error

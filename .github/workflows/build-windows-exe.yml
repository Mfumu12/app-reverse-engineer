name: Build Windows EXE (Gennius DM)

on:
  push:
    paths:
      - "hyperdl/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run tests
        working-directory: hyperdl
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pywebview yt-dlp imageio-ffmpeg pyinstaller
          pytest -v tests

      - name: Build GenniusDM.exe with PyInstaller
        working-directory: hyperdl
        run: |
          pyinstaller --clean --noconfirm hyperdl.spec

      - name: Verify GenniusDM.exe binary
        working-directory: hyperdl
        shell: pwsh
        run: |
          $f = Get-Item .\dist\GenniusDM.exe
          if ($f.Length -lt 5000000) { throw "GenniusDM.exe unexpectedly small: $($f.Length)" }
          $bytes = [System.IO.File]::ReadAllBytes($f.FullName)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE header" }
          Write-Host "Verified GenniusDM.exe ($($f.Length) bytes)"

      - name: Upload GenniusDM.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenniusDM-Windows-x64
          path: hyperdl/dist/GenniusDM.exe
          if-no-files-found: error

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "latest-windows"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $tag "${{ github.sha }}"
          git push -f origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tag" }
          $prevPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevPref
          if (-not $releaseExists) {
            gh release create $tag hyperdl/dist/GenniusDM.exe `
              --title "Gennius DM (Windows x64)" `
              --notes "Download direto do GenniusDM.exe (build automático Windows x64, commit ${{ github.sha }})." `
              --latest
          } else {
            gh release edit $tag `
              --title "Gennius DM (Windows x64)" `
              --notes "Download direto do GenniusDM.exe (build automático Windows x64, commit ${{ github.sha }})." `
              --latest
            gh release upload $tag hyperdl/dist/GenniusDM.exe --clobber
          }
